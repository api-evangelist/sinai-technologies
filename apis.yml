name: Sinai Technologies
description: >-
  SINAI (Sinai Technologies, Inc.) is an AI-powered enterprise carbon management and
  sustainability platform for measuring, reducing, and reporting greenhouse-gas emissions.
  Its HTTP API uses OAuth 2.0 and exposes carbon accounting, the organization /
  business-entity hierarchy, emissions sources and models, industry taxonomy, activity
  periods, and baseline forecasts for decarbonization planning. SINAI supports audit-ready
  reporting for frameworks including CSRD, CBAM, California SB 253/261, and Brazil CVM/SBCE.
