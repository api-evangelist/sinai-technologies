problems:
- status: 400
  title: Bad request
  meaning: The request was malformed or failed validation (bad query params, body, or path values).
  remediation: Check required parameters, types, and body schema against the OpenAPI definition before retrying.
- status: 403
  title: Forbidden
  meaning: The access token is missing, expired, or lacks the OAuth scope required for the operation.
  remediation: Obtain a token with the correct scope (e.g. https://api.sinai.com/carbon_accounting) and send it as Authorization Bearer.
- status: 404
