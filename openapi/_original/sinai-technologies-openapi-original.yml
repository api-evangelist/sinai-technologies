      description: The method used for projecting values or emissions.
      enum:
        - HISTORICAL_AVERAGE_GROWTH_RATE
        - HISTORICAL_AVERAGE_VALUE
        - HISTORICAL_FIXED_VALUE
        - CUSTOM_DATA
        - CUSTOM_GROWTH_RATE
        - CUSTOM_YEARLY_PERCENTAGE_CHANGES
    MainMetricProjection:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/MainMetricProjectionConfig"
        projection:
          $ref: "#/components/schemas/MainMetricProjectionData"
      required:
        - config
        - projection
    MainMetricProjectionConfig:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/MainMetricProjectionID"
        processID:
          $ref: "#/components/schemas/BusinessEntityID"
        baselineScenarioID:
          $ref: "#/components/schemas/BaselineScenarioID"
        startYear:
          $ref: "#/components/schemas/Year"
        endYear:
          $ref: "#/components/schemas/Year"
        projectionMethod:
          $ref: "#/components/schemas/MainMetricProjectionProjectionMethod"
      required:
        - id
        - processID
        - startYear
        - endYear
        - projectionMethod
        - baselineScenarioID
    MainMetricProjectionProjectionMethod:
      type: object
      description: >
        Describes how a projection is configured. This is a discriminated union
        of objects with a 'projectionMethod' property of type ProjectionMethod.
      oneOf:
        - $ref: "#/components/schemas/HistoricalAverageGrowthRateProjectionConfig"
        - $ref: "#/components/schemas/HistoricalAverageValueProjectionConfig"
        - $ref: "#/components/schemas/HistoricalFixedValueProjectionConfig"
        - $ref: "#/components/schemas/CustomDataProjectionConfig"
        - $ref: "#/components/schemas/CustomGrowthRateProjectionConfig"
        - $ref: "#/components/schemas/CustomYearlyPercentageChangesConfig"
    MainMetricProjectionData:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/MainMetricProjectionID"
        processID:
          $ref: "#/components/schemas/BusinessEntityID"
        startYear:
          $ref: "#/components/schemas/Year"
        endYear:
          $ref: "#/components/schemas/Year"
        valuesBaseYear:
          $ref: "#/components/schemas/Year"
        functionalUnit:
          $ref: "#/components/schemas/FunctionalUnit"
        displayUnit:
          $ref: "#/components/schemas/Unit"
        historicalValues:
          type: array
          items:
            $ref: "#/components/schemas/YearData"
        projectedValues:
          type: array
          items:
            $ref: "#/components/schemas/YearData"
      required:
        - id
        - processID
        - startYear
        - endYear
        - valuesBaseYear
        - functionalUnitID
        - displayUnit
        - historicalValues
        - projectedValues
    MainMetricProjectionID:
      type: string
      format: uuid
    PaginationResult:
      type: object
      properties:
        offset:
          type: integer
          description: The current offset in the pagination
        limit:
          type: integer
          description: The maximum number of items per page
        total:
          type: integer
          description: The total number of items available
        hasMore:
          type: boolean
          description: Whether there are more items available after this page
        nextOffset:
          type: integer
          description: The offset for the next page, if available
          nullable: true
        previousOffset:
          type: integer
          description: The offset for the previous page, if available
          nullable: true
      required:
        - offset
        - limit
        - total
        - hasMore
      additionalProperties: false
    FunctionalUnit:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/FunctionalUnitID"
        name:
          type: string
          description: The name of the functional unit
        description:
          type: string
          description: The description of the functional unit
        defaultDisplayUnit:
          $ref: "#/components/schemas/Unit"
        supportedUnits:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        orgID:
          $ref: "#/components/schemas/NullableOrganizationID"
          description: The ID of the organization that owns the functional unit
        subIndustryCode:
          $ref: "#/components/schemas/NullableIndustryTaxonomySubIndustryCode"
          description: The sub-industry code of the functional unit
        measurementType:
          $ref: "#/components/schemas/FunctionalUnitMeasurementType"
          description: The type of measurement of the functional unit
      required:
        - id
        - name
        - supportedUnits
        - defaultDisplayUnit
        - subIndustryCode
    FunctionalUnitMeasurementType:
      type: string
      description: >
        The type of measurement of the functional unit. COUNTER is used for
        attributes that are added across time periods (e.g., steel produced).
        GAUGE is used for attributes that are not added across time periods
        (e.g., number of employees).
      enum:
        - COUNTER
        - GAUGE
    FunctionalUnitID:
      type: string
      format: uuid
    IndustryTaxonomySector:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IndustryTaxonomySectorID"
        name:
          type: string
        sectorCode:
          $ref: "#/components/schemas/IndustryTaxonomySectorCode"
      required:
        - id
        - name
        - sectorCode
    IndustryTaxonomySectorCode:
      type: string
      pattern: ^\d{2}$
      description: The sector code of the business entity or functional unit,
        formatted as two digits.
    IndustryTaxonomySectorID:
      type: string
      format: uuid
    IndustryTaxonomyIndustryGroup:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IndustryTaxonomyIndustryGroupID"
        name:
          type: string
        industryGroupCode:
          $ref: "#/components/schemas/IndustryTaxonomyIndustryGroupCode"
      required:
        - id
        - name
        - industryGroupCode
    IndustryTaxonomyIndustryGroupCode:
      type: string
      pattern: ^\d{4}$
      description: The industry group code of the business entity or functional unit,
        formatted as four digits.
    IndustryTaxonomyIndustryGroupID:
      type: string
      format: uuid
    IndustryTaxonomyIndustry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IndustryTaxonomyIndustryID"
        name:
          type: string
        industryCode:
          $ref: "#/components/schemas/IndustryTaxonomyIndustryCode"
      required:
        - id
        - name
        - industryCode
    IndustryTaxonomyIndustryCode:
      type: string
      pattern: ^\d{6}$
      description: The industry code of the business entity or functional unit,
        formatted as six digits.
    IndustryTaxonomyIndustryID:
      type: string
      format: uuid
    IndustryTaxonomySubIndustry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IndustryTaxonomySubIndustryID"
        name:
          type: string
        subIndustryCode:
          $ref: "#/components/schemas/IndustryTaxonomySubIndustryCode"
      required:
        - id
        - name
        - subIndustryCode
    IndustryTaxonomySubIndustryID:
      type: string
      format: uuid
    IndustryTaxonomySubIndustryCode:
      type: string
      pattern: ^\d{8}$
      description: The sub-industry code of the business entity or functional unit,
        formatted as eight digits.
    NullableIndustryTaxonomySubIndustryCode:
      type: string
      pattern: ^\d{8}$
      description: The sub-industry code of the business entity or functional unit,
        formatted as eight digits.
      nullable: true
    CountryCode:
      type: string
      description: The country code of the business entity.
    FacilityTypeID:
      type: string
      format: uuid
      description: The facility type of the business entity if it is a facility.
    NullableFacilityTypeID:
      type: string
      format: uuid
      description: The facility type of the business entity if it is a facility.
      nullable: true
    ProcessTypeID:
      type: string
      format: uuid
      description: The process type of the business entity if it is a process.
    NullableProcessTypeID:
      type: string
      format: uuid
      description: The process type of the business entity if it is a process.
      nullable: true
  securitySchemes:
    OAuth2ClientCredentialsProduction:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.sinai.com/oauth2/token
          scopes:
            https://api.sinai.com/organization: Grants access to organization functions
            https://api.sinai.com/carbon_accounting: Grants read/write access to carbon accounting data
            https://api.sinai.com/baseline_forecasts: Grants read/write access to baseline forecasts data
            https://api.sinai.com/transition_plan: Grants read/write access to transition plan data
            https://api.sinai.com/reduction_projects: Grants read/write access to reduction projects data
            https://api.sinai.com/decarbonization_roadmap: Grants read/write access to decarbonization roadmap data
    OAuth2AuthCodeProduction:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.sinai.com/oauth2/authorize
          tokenUrl: https://auth.sinai.com/oauth2/token
          scopes: {}
security:
  - OAuth2ClientCredentialsProduction:
      - https://api.sinai.com/organization
      - https://api.sinai.com/carbon_accounting
      - https://api.sinai.com/baseline_forecasts
      - https://api.sinai.com/transition_plan
      - https://api.sinai.com/reduction_projects
      - https://api.sinai.com/decarbonization_roadmap
  - OAuth2AuthCodeProduction: []

